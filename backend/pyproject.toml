[project]
name = "astrail-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.0.0",
    "openai-agents>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "mem0ai>=0.1.0",
    "langfuse>=2.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "slowapi>=0.1.9",
    "posthog>=3.0.0",
]

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: makes real OpenAI/Apify calls; skipped unless --run-live",
    "integration: hits the live dev Supabase DB; skipped unless RUN_DB_INTEGRATION=1",
]
