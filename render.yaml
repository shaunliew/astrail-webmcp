# Render service config (replaces fly.toml). Singapore region, always-on Starter.
services:
  - type: web
    name: astrail-backend
    runtime: docker
    repo: https://github.com/MalaysiaKaki/astrail
    # Pins what the Render dashboard already says, so it is a no-op against the running
    # service. Without it, a Blueprint CONFIGURATION SYNC — which applies to every service
    # the Blueprint names and is not governed by `autoDeployTrigger` — falls back to the
    # repository default (main) and silently retargets this service.
    branch: dev
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # AUTO-DEPLOY IS ON, AND GATED. With it on, THE MERGE IS THE DEPLOY — there is no gap in
    # which a human confirms the shipping code still works against the live schema. The
    # `preDeployCommand` below is what replaced that gap.
    #
    # WHAT THE GATE DOES. `backend/scripts/assert_schema.py` holds a manifest of the columns
    # this code version requires and probes each one through PostgREST
    # (`select(cols).limit(0)` — reads no rows). A column production does not have exits 1,
    # Render aborts the rollout, and the OLD code keeps serving. It probes rather than migrates
    # because the image is `python:3.14-slim` + uv deps + `backend/` — no Supabase CLI, no psql
    # — and the environment carries only `SUPABASE_URL` (the REST endpoint), never a postgres
    # DSN, so `preDeployCommand: supabase migration up` is not available to us.
    #
    # THIS GATE IS THE ONLY DRIFT DETECTION. `/health` still performs no schema check, so a
    # code-first deploy against an old schema stays GREEN while jobs silently fail to start.
    #
    # IT SEES COLUMNS ONLY. A changed RPC signature, a dropped conflict key or a changed
    # SQLSTATE are all invisible to it — and both migrations that motivated the old manual-only
    # protocol are exactly that kind. `20260720100000_reel_place_mentions_user_scope` drops the
    # `(reel_cache_id, place_id)` conflict key that the deployed `_persist_mention` upsert
    # targets, so old and new code cannot both work against either schema — the migration says
    # so itself. `20260720130000_organize_job_error_codes` changes the raised SQLSTATE from
    # P0001 to AS4xx, so BOTH orderings return 500 for the length of the window. For that class,
    # set the trigger to `off`, deploy by hand, and follow
    # docs/superpowers/plans/2026-07-20-saved-reels-release-runbook.md.
    #
    # EXTEND THE MANIFEST IN THE SAME PR AS THE MIGRATION that introduces the requirement. A
    # writer that ships ahead of its manifest entry ships unguarded, which is the whole failure
    # this gate exists to prevent.
    #
    # IF A DEPLOY ABORTS: the pre-deploy log names the table and column. Apply the pending
    # migration to production and redeploy; if the manifest is what is stale, fix it in the same
    # PR as the migration. Nothing is left half-applied — pre-deploy runs on a separate instance
    # and its filesystem changes are discarded.
    #
    # `checksPass`, NOT `commit`. Two workflows gate every push to dev, and BOTH must pass:
    #   rls-tests.yml     applies every migration to a local Supabase + runs the pgTAP RLS tests,
    #                     so an invalid migration fails CI and the deploy never fires.
    #   backend-tests.yml runs the backend pytest suite + the frozen #16 eval. This one also
    #                     covers `scripts/assert_schema.py`'s OWN tests — without it the gate below
    #                     could be narrowed to a no-op by a PR that never touches SQL, and
    #                     `checksPass` would happily fire. The gate needs a gate.
    # `autoDeploy` is the deprecated spelling of this field.
    autoDeployTrigger: checksPass
    # ABSOLUTE PATH AND NO SHELL SYNTAX, for the same reason the worker's `dockerCommand` note
    # below gives: Render does not document whether pre-deploy is shell-wrapped on a Docker
    # service, nor what the working directory is. The script is self-contained — it builds its
    # own Supabase client and imports nothing from `backend/` — so this form needs neither a
    # `cd` nor PYTHONPATH and behaves identically either way.
    preDeployCommand: python /app/backend/scripts/assert_schema.py
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: MAPBOX_SECRET_TOKEN
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://astrail.xyz,https://www.astrail.xyz
      # BETA CAPACITY. Retuned 5 -> 10 by the free-trial + beta-seat entitlement arc: a beta
      # seat's "unlimited" planning rides this daily quota, so 5 was the real ceiling on a
      # granted seat. Over the cap returns 429 `rate_limited`.
      #
      # DECLARED HERE, NOT DASHBOARD-ONLY, and that is the point. This key already carried a
      # literal `value:`, so a Blueprint CONFIGURATION SYNC re-applies it — and a sync is NOT
      # governed by `autoDeployTrigger` (see the header note above). Setting 10 in the dashboard
      # while this file still said 5 would let a sync overwrite it back to 5, halving beta
      # capacity with nothing in the deploy log naming the quota as the cause. Not hypothetical:
      # the 2026-08-02 worker breakage recorded in the `PYTHONPATH` note below is this exact
      # failure mode. (A Blueprint sync DOES redeploy the services it touches — the danger is
      # not silence, it is that the redeploy looks routine and the reverted value is not called
      # out anywhere.)
      #
      # ENTITLEMENTS_ENABLED and TRIAL_LIFETIME_LIMIT are DELIBERATELY NOT declared here.
      # Render PRESERVES dashboard env vars that a Blueprint omits — it does not delete them —
      # so an undeclared key set by hand survives a sync untouched. That is what makes
      # ENTITLEMENTS_ENABLED a real rollback lever: a `value: "true"` here would instead be
      # re-asserted by any sync and could undo an in-progress rollback. Their code defaults in
      # `backend/rate_limit.py` (true / 1) independently equal the intended production values,
      # so the undeclared state is also correct-by-default.
      #
      # COROLLARY for rollback: while rollback overrides are active, do NOT modify this file or
      # manually sync the Blueprint — a sync would re-assert this quota to 10 while
      # ENTITLEMENTS_ENABLED=false still routes to the legacy no-lifetime-cap path. An ordinary
      # push to `dev` that does NOT touch render.yaml is fine; Blueprint sync is triggered by a
      # change to the Blueprint file, not by any push. KNOWN RESIDUAL (deferred, not a blocker):
      # rollback spans two settings in two places (dashboard flag + Blueprint quota), so it is
      # not atomic. The structural fix — have ENTITLEMENTS_ENABLED=false force the legacy quota
      # in code, making rollback one flag — is a `rate_limit.py` behaviour change and is
      # deliberately NOT bundled into this deploy; see docs/deploy/2026-08-03-entitlements-go-live.md.
      - key: DAILY_TRIP_QUOTA
        value: "10"
      - key: BURST_LIMIT
        value: 3/minute

  # Telegram reel-ingestion worker. No inbound HTTP: it long-polls the Telegram Bot API
  # (direct httpx, no python-telegram-bot — see .claude/docs/STACK.md) and runs the same
  # organize job the web service does. ONE image serves both services; `dockerCommand`
  # overrides the Dockerfile's CMD per service, so the Dockerfile is unchanged.
  - type: worker
    name: astrail-telegram-ingest
    runtime: docker
    repo: https://github.com/MalaysiaKaki/astrail
    branch: dev                 # REQUIRED — an omitted branch defaults to the repo default
                                # (main), whose image may lack telegram_ingest. The web
                                # service's dev tracking lives in the dashboard, not here.
    region: singapore
    plan: starter
    numInstances: 1             # two getUpdates consumers is a hard 409
    dockerfilePath: ./Dockerfile
    # NO SHELL SYNTAX HERE — Render passes dockerCommand as ARGV, not to a shell.
    # Established by three failed deploys on 2026-08-02, in this order:
    #   `sh -c "cd backend && exec python -m …"` -> sh: 1: <whole string>: not found
    #   `cd backend && exec python -m …`         -> exit 128, NO output at all
    #   `python -m telegram_ingest.worker`       -> boots clean
    # The second one is the proof: no `sh:` error means no shell ran, so there is no `cd`
    # to exec and the container dies before producing a line. `cd`, `&&`, `exec` and quotes
    # are all unusable in this field.
    #
    # This is NOT the same field as the Dockerfile's
    # `CMD ["sh","-c","cd backend && exec uvicorn …"]`. That is exec-form: a JSON array
    # Docker passes as argv verbatim, so something must BE the shell and the `sh -c` is
    # required. Same text, different parser. astrail-backend uses the Dockerfile CMD and
    # leaves dockerCommand empty, so this field had no working precedent in this repo.
    #
    # PYTHONPATH below replaces what `cd backend` was doing: WORKDIR is /app and the app is
    # copied to /app/backend, so the path makes both `telegram_ingest.worker` and the bare
    # imports (`from organizer import …`) resolve without changing directory. Verified by
    # running `PYTHONPATH=backend python -m telegram_ingest.worker` locally — it reaches
    # config validation, which is proof every import resolved.
    #
    # Losing `exec` costs the drain-on-SIGTERM path IF Render ever wraps this in a shell.
    # It does not today (python is PID 1), and the degradation is bounded either way: an
    # in-flight job holds a lease that expires in <=300s and the web reaper reclaims it.
    dockerCommand: python -m telegram_ingest.worker
    # Same gate, same reasoning as astrail-backend above — read that block, it is the canonical
    # one. This service needs its own copy because a Blueprint field is per-service: the worker
    # runs the SAME organize path against the SAME schema, so a rollout here against a drifted
    # database fails exactly as silently. Pre-deploy is supported on paid background workers.
    autoDeployTrigger: checksPass
    preDeployCommand: python /app/backend/scripts/assert_schema.py
    maxShutdownDelaySeconds: 120
    # PYTHONPATH is DECLARED HERE with a literal value, not left to the dashboard. This
    # service is Blueprint-managed, so a sync re-applies this file and overwrites anything
    # set by hand — which is exactly how the 2026-08-02 post-merge deploy broke: a working
    # dashboard `dockerCommand` was replaced by the wrong value still sitting in here.
    # Anything the worker cannot boot without belongs in this file, not in the dashboard.
    # It is a container path, not a secret, so it takes a literal `value:`.
    #
    # The eight secrets below are `sync: false` — entered in the dashboard, never a literal
    # `value:` here.
    #
    # DELIBERATELY ABSENT, verified by grep — do not "complete" this list:
    #   MEM0_API_KEY, LANGFUSE_*  the organize path never reaches them. `mem0_client` is
    #                             imported only by main.py and pipeline/runner.py (both
    #                             web-only), and `pipeline/tracing.py`'s default tracer is
    #                             a no-op that nothing imports outside tests + evals.
    #   SUPABASE_JWT_SECRET       auth is web-only, and the project verifies ES256 via JWKS.
    #   ALLOWED_ORIGINS,          CORS, quota, throttle and port all belong to inbound HTTP,
    #   DAILY_TRIP_QUOTA,         which a worker does not have.
    #   BURST_LIMIT, PORT
    envVars:
      - key: PYTHONPATH                 # replaces `cd backend`; see the dockerCommand note
        value: /app/backend
      - key: OPENAI_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: MAPBOX_SECRET_TOKEN        # grounding._ground_place resolves every place
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_CHAT_IDS  # fail-CLOSED: unset or blank is a boot failure,
        sync: false                     # never "allow every chat". See .claude/docs/ENV.md.
      - key: ASTRAIL_INGEST_USER_ID
        sync: false
