[project]
name = "astrail-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.0.0",
    "openai-agents>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "mem0ai>=2.0,<3.0",
    "langfuse>=2.0.0",
    # sentry-sdk removed (ISSUES-B1): it was staged but `sentry_sdk.init` was called nowhere.
    # Its FastAPI integration captures full request URLs, so re-adding it would reintroduce the
    # very `?token=<JWT>` leak log_redaction.py exists to close. Re-add ONLY with a `before_send`
    # URL scrubber — and note NO test guards that path: Sentry ships URLs to its own backend,
    # not through a log handler, so test_log_redaction.py cannot see it. This comment is the guard.
    "slowapi>=0.1.9",
    "posthog>=3.0.0",
]

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    # Only consumer is test_lint_undefined_names.py, which runs `ruff check --select F821`
    # in-process. A dev dependency rather than a `uvx` call so the gate needs no network.
    "ruff>=0.14.0",
    # Only consumer is test_reserve_enqueue_race.py, the two-session concurrency race test
    # for reserve_and_enqueue_trip_job. Async driver (psycopg.AsyncConnection) so three direct,
    # non-pooled connections can race under pytest-asyncio. Integration-only, keyless-offline-safe
    # (the test is skipped unless RUN_DB_INTEGRATION=1). [binary] ships prebuilt libpq.
    "psycopg[binary]>=3.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# tmpastrail-*: permission-locked temp dirs left by sandboxed agent runs on Windows —
# undeletable (container-SID deny ACLs) and break collection with PermissionError if scanned.
norecursedirs = [".*", "build", "dist", "node_modules", ".venv", ".pytest-tmp", "tmpastrail-*"]
markers = [
    "live: makes real OpenAI/Apify calls; skipped unless --run-live",
    "integration: hits the live dev Supabase DB; skipped unless RUN_DB_INTEGRATION=1",
]
