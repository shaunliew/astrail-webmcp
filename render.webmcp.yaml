# HACKATHON BLUEPRINT — OpenAI WebMCP Challenge. NEVER merged upstream, never synced against
# production. Set Render's Blueprint Path to this file.
#
# WHY A SEPARATE FILE, AND A DIFFERENT SERVICE NAME. Render's own docs warn against managing one
# service from more than one Blueprint. A copy of `render.yaml` would name `astrail-backend` —
# the PRODUCTION service — and two Blueprints fighting over it is exactly the unpredictable state
# that warning describes. Renamed, so there is no path by which this file can touch production.
#
# WHAT IS DELIBERATELY ABSENT: `astrail-telegram-ingest`. It is out of scope for this entry, and a
# second worker long-polling the same bot against the SHARED production database would
# double-process real users' reel submissions.
services:
  - type: web
    name: astrail-webmcp-api          # DIFFERENT from production's `astrail-backend`. Do not align.
    runtime: docker
    repo: https://github.com/shaunliew/astrail-webmcp
    branch: main
    region: singapore
    plan: starter
    # ⚠️ FREE IS NOT AN OPTION HERE. Free spins down after 15 minutes idle and takes ~60s to wake.
    # A judge opening a cold link waits a minute for the first pixel and THEN 60-180s for a
    # generation. Two minutes before anything appears is a lost submission, not an annoyance.
    #
    # PINNED TO ONE INSTANCE, for the same billing reason production is: the geocode single-flight
    # lock lives in THIS process's memory, so a second instance double-bills the paid Mapbox
    # permanent geocode ($5/1,000, no free tier).
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Same schema gate production uses: probes the columns this code needs through PostgREST and
    # aborts the rollout if the live schema lacks one, leaving the old code serving. It reads no
    # rows and writes nothing.
    preDeployCommand: python /app/backend/scripts/assert_schema.py
    envVars:
      # The five REQUIRED_SECRETS. `config_validation.py` fails closed and names every missing one
      # at once, so a bad set is one restart rather than five.
      - key: OPENAI_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MAPBOX_SECRET_TOKEN
        sync: false
      # Needed for JWT verification of the judge's session.
      - key: SUPABASE_JWT_SECRET
        sync: false
      # ⚠️ MUST be the Vercel origin of THIS deployment. Unset falls back to the production
      # astrail.xyz origins, which fails as a browser CORS block — every tool call dies with
      # nothing useful in the console, and it looks like the integration is broken.
      - key: ALLOWED_ORIGINS
        sync: false
      # The edit endpoints 404 without this. The tools still REGISTER either way, so the symptom
      # is sixteen tools that exist and refuse — set it to true or the demo's edit beat is dead.
      - key: WEBMCP_EDITS_ENABLED
        value: "true"
      # Read at import in rate_limit.py, so raising it needs a RESTART, not just a value change.
      - key: DAILY_TRIP_QUOTA
        value: "25"
      # Memory (mem0). OPTIONAL by design — absent means memory is DISABLED, never a boot
      # failure (mem0_client.py:63-65, and it is deliberately not in REQUIRED_SECRETS).
      #
      # It is declared here because production's render.yaml:91 has it and omitting it made the
      # hackathon service quietly worse than the real product: GET /settings/preferences returns
      # status "disabled", the Settings screen reads "memory is off by configuration", and every
      # generation falls to inferred defaults. Recall is also the only thing the AGENT path can
      # exercise — plan_trip_from_reels leaves `preferences` blank, and blank is exactly the
      # condition under which mem0 is searched (pipeline/preferences.py:114).
      - key: MEM0_API_KEY
        sync: false
      # 🚨 RUN_DELETION_SWEEP IS DELIBERATELY ABSENT AND MUST STAY ABSENT.
      # This service shares the PRODUCTION database. Setting it makes a second backend sweep real
      # user accounts for deletion every 120 seconds. It is the single most dangerous line that
      # could be added to this file.
      #
      # Note the sweep that is NOT flag-gated: `_reap_loop` redispatches stuck jobs in every
      # process, so this service can pick up and re-run someone else's job, spending real Apify
      # and OpenAI credit. Nothing to configure — just do not leave it idling unused.
      #
      # Sentry is omitted on purpose too: SENTRY_ENVIRONMENT defaults to "production", so a DSN
      # here would file hackathon errors into real production monitoring.
